[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm", "build", "sphinx", "Cython>=0.29.36"]
build-backend = "setuptools.build_meta"

[project]
name = "dual_autodiff"
dynamic = ["version"]  
description = "A Python package for forward-mode automatic differentiation using dual numbers."
readme = "README.md"  
requires-python = ">=3.9" 
license = { text = "MIT" } 
authors = [
    { name = "Jacob Tutt", email = "jacobtutt@icloud.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []  

[project.optional-dependencies]
tutorial = ["numpy", "nbsphinx", "jupyter"]
cython = ["cython"]
testing = ["pytest"]

[project.urls]
"Source" = "https://github.com/JacobTutt/dual_autodiff"  
"Issues" = "https://github.com/JacobTutt/dual_autodiff/issues" 

[tool.setuptools_scm]
version_scheme = "post-release"  
local_scheme = "no-local-version"  
write_to = "dual_autodiff/version.py"  

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]